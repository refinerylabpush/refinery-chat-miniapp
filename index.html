              var q = Math.max(0, Math.min(1, (p - seg[k][0]) / (seg[k][1] - seg[k][0])))
              el.style.strokeDashoffset = lens[k] * (1 - q)
            })
            if (x < 1 && document.getElementById('logo-top')) requestAnimationFrame(tick)
            else if (x >= 1) top.removeAttribute('mask')
          }
          tick()
        }

        // подпись под логотипом меняется, пока приложение грузится (после загрузки её заменит само приложение)
        var phrases = ['Открываем рабочий чат…', 'Загружаем диалоги…', 'Подбираем переписки для вас…']
        var n = 0
        var timer = setInterval(function () {
          var el = document.getElementById('boot-phrase')
          if (!el) return clearInterval(timer)
          n = (n + 1) % phrases.length
          var clone = el.cloneNode(false)
          clone.textContent = phrases[n]
          el.parentNode.replaceChild(clone, el) // новый элемент — анимация подписи начинается заново
        }, 2000)

        var BASE = 'https://rcdejyidcxubahgtxcar.supabase.co/functions/v1/bitrix-handler'
        fetch(BASE + '/manifest.json', { cache: 'no-store' })
          .then(function (res) { return res.json() })
          .then(function (m) {
            m.css.forEach(function (c) {
              var l = document.createElement('link')
              l.rel = 'stylesheet'
              l.href = BASE + '/' + c
              document.head.appendChild(l)
            })
            m.js.forEach(function (j) {
              var s = document.createElement('script')
              s.type = 'module'
              s.crossOrigin = 'anonymous'
              s.src = BASE + '/' + j
              document.body.appendChild(s)
            })
          })
          .catch(function () {
            var el = document.getElementById('boot-phrase')
            if (el) el.textContent = 'Не удалось загрузить. Закройте и откройте снова.'
          })
      })()
    </script>
  </body>
</html>
